*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#18364b;font:14px "Microsoft YaHei",Arial,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:276px;background:#153349;color:#d9e7ef;padding:26px 18px;overflow:auto}h1{font-size:21px;margin:0 0 8px}aside p{font-size:12px;color:#a9c1d0;line-height:1.8}.nav{display:grid;gap:8px;margin-top:22px}.nav button{border:1px solid #38566b;border-radius:8px;background:transparent;color:#e1edf3;text-align:left;padding:10px 12px;line-height:1.6;cursor:pointer}.nav button.active,.nav button:hover{background:#2d5c77;border-color:#7eb8c8}.nav small{display:block;color:#98d0dc;font-size:10px}main{margin-left:276px;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h2{margin:8px 0;font-size:24px}.badge{font-size:12px;background:#e1edf4;color:#2c5975;padding:5px 10px;border-radius:18px}.meta{color:#6c8393;font-size:12px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 12px}.tools button,.tools a{font:inherit;font-size:12px;padding:8px 12px;background:white;border:1px solid #c4d5e0;border-radius:7px;color:#285974;text-decoration:none;cursor:pointer}.viewport{height:calc(100vh - 270px);min-height:420px;background:white;border:1px solid #d4e0e8;border-radius:10px;padding:16px;overflow:auto}.viewport img{display:block;max-width:none;height:auto}.notes{margin-top:14px;color:#536e80;line-height:1.9;font-size:12px}.docs{display:flex;flex-wrap:wrap;gap:16px;margin:18px 0}.docs a{color:#286885;font-size:12px}footer{color:#7b909f;line-height:1.8;font-size:11px}@media(max-width:850px){aside{position:static;width:auto}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}main{margin:0;padding:16px}header{display:block}.viewport{height:65vh}}
</style></head><body><aside><h1>德育分统计系统</h1><p>当前实现 · 2026-10-26<br>4 张 UML 类图 · 5 张 ER 图<br>37 表 · 333 字段 · 84 外键</p><div class="nav" id="nav"></div><p>灰色表是历史兼容结构。<br>实体、服务职责与跨图引用分别标注。<br>本次图册只包含 UML 与 ER。</p></aside><main><header><div><span class="badge" id="kind"></span><h2 id="title"></h2><div class="meta" id="meta"></div></div><span class="badge">与当前实现核对</span></header><div class="tools"><button id="fit">适应宽度</button><button id="zoom-out" aria-label="缩小">−</button><span id="scale"></span><button id="zoom-in" aria-label="放大">＋</button><button id="actual">100%</button><a id="svg" target="_blank" rel="noopener">SVG 原图</a><a id="png" target="_blank" rel="noopener">PNG 图片</a><a href="VisualParadigm/德育分统计系统-设计评审.vpp">可编辑 VP 工程</a></div><div class="viewport" id="viewport"><img id="figure" alt="系统设计图"></div><div class="notes" id="notes"></div><div class="docs"><a href="../项目改动简要总结.md">项目改动简要总结</a><a href="设计评审说明.md">当前设计说明</a><a href="数据字典.md">37 表完整数据字典</a><a href="当前UML核对说明.md">UML 建模依据</a><a href="当前ER核对说明.md">ER 核对依据</a></div><footer>清晰 SVG/PNG 使用 Graphviz 从同一语义模型独立生成；VP 原生工程由 Visual Paradigm OpenAPI 创建。图中不包含真实学生数据。</footer></main><script>
const diagrams=[{"id":"01-rbac-organization","name":"UML：RBAC 与班级学年组织","kind":"class","nodes":13,"edges":18,"width":2664,"height":1189,"notes":["User.baseIdentity 为 STUDENT / COUNSELOR / ADMIN，互斥身份用属性表达；班长、审查员采用可叠加角色授权，不画身份继承树。","数据域为 OWN / CLASS / LED_CLASSES / CLASS_PUBLIC / SYSTEM_METADATA。每条角色操作授权先与其范围、实际班级关系和对象规则求交，再合并合法授权。","每个启用班级须有一名班长和至少两名不同学生审查员；禁止自审；管理员不读取学生证明或处理业务审批。","管理员指定当前统计学年；Enrollment 保留各学年的班级归属，学生填报页不自行选择学年。","角色有效期及带班关系在每次对象访问时复核；公示权限还需通过具体班级学年的开放状态检查。","删除前备份；有外部审核引用的用户保留匿名DELETED占位，原用户名和学号可重建；班长/审查员须先交接。"]},{"id":"02-application-evidence-review","name":"UML：大类申报、小项、内容版本与审核","kind":"class","nodes":12,"edges":13,"width":1533,"height":2125,"notes":["大类申报是聚合容器，审核和计分以小项当前轮次为单位；每个主文件默认一个小项，补充附件仍归当前小项。","草稿没有当前提审轮次。轮次状态为 PENDING_PEER、PENDING_COUNSELOR、APPROVED、REJECTED、WITHDRAWN；已通过项锁定，大类仍可新增。","单项和批量直接提交当前填写分值（包括0）；未保存改动先保存。逐项乐观版本与重复点击保护，批量允许部分成功并保留失败项。","科研、文体竞赛、任职三类：有效认定可复用；未知资格交辅导员；无效匹配须更正。其余四类不以隐藏的旧活动ID阻塞。","竞赛重复由审查员对照同类小项判断；当前流程不自动关联、替代、拒绝或恢复其它申请。绿色批准直接完成，驳回填写理由。","CategoryItem与Application为当前业务成对映射；物理唯一FK仅保证Application对应0..1个CategoryItem。","组合线表示版本/轮次归属；workingRevisionId与currentRoundId分别为当前指针，不代表组成集合多重性。"]},{"id":"03-activity-scoring-publicity","name":"UML：活动认定、政策计分、公示与导出","kind":"class","nodes":14,"edges":16,"width":2644,"height":1836,"notes":["活动匹配支持全库名称及别名搜索，显示有效、无效、待认定；AI仅从检索到的合法候选匹配，用户可更改或清除。","资格统一按活动、大类、学年判定；通用认定与历史具体范围冲突，或只有旧限定认定时为UNKNOWN，由辅导员确认。","科研与文体已通过小项SUM后按大类封顶；任职MAX，志愿年度子项封顶1；七类上限为3/3/4/10/6/4/5，总分以70为基准。","AI按本人关联事实与政策生成建议，学生申报分经人工审核后进入汇总。成绩是查询派生结果，未新增可编辑成绩表。","公示开启前所有正式小项须审结；公示中暂停正式提交。公示只提供可靠脱敏投影；导出含无申请成员的70分，顶部可查阅原校PDF。"]},{"id":"04-materials-background-jobs","name":"UML：材料、证据与 OCR / AI 独立后台并行","kind":"class","nodes":14,"edges":19,"width":2178,"height":1922,"notes":["确认上传才启动。PDF先读取可用文字层；扫描件≤12页识别全页，长扫描件只识别首页末页正文，个人信息可手动定位。每份文件仅首末页查章，多章取最后一个。","有可用文字的OCR完成后自动幂等排AI。每用户最多同时识别3个文件、分析3个小项，两类独立；等待OCR的AI不占分析运行名额，跨页面/刷新继续。","相同页内容及接口复用缓存；腾讯调用预留与本地月计数原子更新。只用免费额度，达到保护或资源停止条件即保留结果；归档次数不会因清理材料而清零。","输入指纹、内容版本及workerToken共同保护。空白新稿可自动填写，人工稿仅保留建议；改稿/冻结的迟到结果不覆盖。重启只恢复已失去进程的任务，不抢占活进程。","参与证据包含身份及本人奖次/考评：能同框则1张，否则最多2张，原页整宽且1/4页高；有效性仅活动名称1处、时间、印章。公示脱敏未就绪不放出原图。","暂停/继续同时控制上传、OCR和AI；站内切页继续，登出/最后一个本站标签离开暂停，45秒失联兜底。普通刷新仅对同页短时离开恢复，手动/登出暂停须明确继续。","已发请求返回后保存检查点；暂停后不启动后续页/文件/模型请求。完成结果和私有响应缓存供恢复复用。","所有腾讯文字/印章请求统一生成受限JPEG副本并将返回坐标映射原页；原件不改。证据计算、裁图、AI整理在短写事务之外，落库时重核指纹和人工修改。","JobWorker框同时表达实际执行类与同模块队列控制函数的职责分组；task_control与页面租约使用现有SystemSetting JSON，不新增实体表。"]},{"id":"08-er-overview","name":"数据库 ER 总览 · 37 张实际表","kind":"erd","nodes":37,"edges":49,"width":2431,"height":1341,"notes":["总览展示 49 条主干外键；四张分图完整展示全部 84 条物理外键。","灰色表为历史兼容：旧竞赛项目与替代记录保留，当前不运行自动替代。","当前学年、OCR用量归档、AI依赖及文件租约存于JSON，属于逻辑引用，不增加物理外键。"]},{"id":"09-er-rbac","name":"数据库 ER · 组织与RBAC","kind":"erd","nodes":12,"edges":17,"width":1649,"height":1728,"notes":["本图按外键所在子表分组，展示 17 条实际外键；跨组父表只显示主键。","PK 主键；FK 外键；UK 单列唯一；UQ 联合唯一；? 可空。乌鸦脚表示0..*，单线加圆圈表示0..1。"]},{"id":"10-er-evidence","name":"数据库 ER · 材料、识别与后台任务","kind":"erd","nodes":14,"edges":21,"width":3382,"height":2098,"notes":["本图按外键所在子表分组，展示 21 条实际外键；跨组父表只显示主键。","PK 主键；FK 外键；UK 单列唯一；UQ 联合唯一；? 可空。乌鸦脚表示0..*，单线加圆圈表示0..1。"]},{"id":"11-er-workflow","name":"数据库 ER · 大类申报与逐项审核","kind":"erd","nodes":16,"edges":29,"width":3473,"height":1482,"notes":["本图按外键所在子表分组，展示 29 条实际外键；跨组父表只显示主键。","PK 主键；FK 外键；UK 单列唯一；UQ 联合唯一；? 可空。乌鸦脚表示0..*，单线加圆圈表示0..1。","灰色历史替代表及旧项目字段保留兼容，当前竞赛重复由审查员判断。"]},{"id":"12-er-catalog","name":"数据库 ER · 活动、计分、公示与设置","kind":"erd","nodes":13,"edges":17,"width":1675,"height":2101,"notes":["本图按外键所在子表分组，展示 17 条实际外键；跨组父表只显示主键。","PK 主键；FK 外键；UK 单列唯一；UQ 联合唯一；? 可空。乌鸦脚表示0..*，单线加圆圈表示0..1。"]}];let selected,ratio=1,base=1;const figure=document.getElementById('figure'),nav=document.getElementById('nav'),viewport=document.getElementById('viewport');
function resize(){figure.style.width=Math.round(base*ratio)+'px';document.getElementById('scale').textContent=Math.round(ratio*100)+'%'}function fit(){ratio=Math.min(1,(viewport.clientWidth-34)/base);resize()}function zoom(change){ratio=Math.max(.15,Math.min(3,ratio+change));resize()}
for(const [i,d]of diagrams.entries()){const button=document.createElement('button');button.innerHTML='<small>'+d.id+'</small>'+d.name;button.onclick=()=>select(i);nav.append(button)}
function select(i){selected=diagrams[i];[...nav.children].forEach((button,j)=>button.classList.toggle('active',i===j));document.getElementById('kind').textContent=selected.kind==='class'?'UML 类图':'数据库 ER';document.getElementById('title').textContent=selected.name;document.getElementById('meta').textContent=selected.nodes+' 个节点 · '+selected.edges+' 条关系 · 2026-10-26';const url='图稿/'+selected.id;figure.onload=()=>{base=selected.width;fit()};figure.src=url+'.svg';document.getElementById('svg').href=url+'.svg';document.getElementById('png').href=url+'.png';const notes=document.getElementById('notes');notes.replaceChildren();for(const line of selected.notes){const p=document.createElement('div');p.textContent='• '+line;notes.append(p)}viewport.scrollTo(0,0);history.replaceState(null,'','#'+selected.id)}
document.getElementById('fit').onclick=fit;document.getElementById('zoom-out').onclick=()=>zoom(-.15);document.getElementById('zoom-in').onclick=()=>zoom(.15);document.getElementById('actual').onclick=()=>{ratio=1;resize()};select(Math.max(0,diagrams.findIndex(d=>d.id===decodeURIComponent(location.hash.slice(1)))));
</script></body></html>

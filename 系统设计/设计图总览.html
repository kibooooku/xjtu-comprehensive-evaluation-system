<script>const diagrams=[{"id": "01-rbac-organization", "name": "RBAC与班级组织领域类图", "kind": "class", "nodes": 12, "edges": 16, "width": 2322, "height": 1111, "notes": ["User的基础身份互斥；班长、审查员是可叠加的RoleAssignment，不采用学生子类继承表达。", "权限判定=角色操作授权∩该条授权的数据范围∩强制业务策略；只在完整授权之间求并集。", "班长和审查员授权绑定classId；辅导员范围来自CounselorClassAssignment，学生本人及本班范围来自Enrollment。", "每班一名现任班长、至少两名不同的学生审查员；管理员不读取证明、不参与业务审核。", "Enrollment记录学生所选学年的班级归属；ClassYear同时作为公示和正式提交的并发边界。", "ClassYear./publicityState是读模型派生属性；唯一持久化当前公示状态在ClassPublicity.isOpen。", "RolePermission.dataScope为资源操作最大范围OWN/CLASS/LED_CLASSES/CLASS_PUBLIC/SYSTEM_METADATA；与Role.scopeKind和RoleAssignment实际范围相交后，再执行对象强制策略。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}, {"message": "Warning: no value for width of non-ASCII character 194. Falling back to width of space character", "level": "warning"}]}, {"id": "02-application-evidence-review", "name": "申请版本、证据与审核领域类图", "kind": "class", "nodes": 12, "edges": 17, "width": 1176, "height": 2533, "notes": ["Application保持稳定标识；ApplicationRevision保存内容；SubmissionRound拥有各次提审状态，三者不能合成一条可覆盖记录。", "工作稿修改形成新修订；正式提交冻结修订并创建新轮次。ReviewDecision、StateEvent和AwardSupersession绑定轮次及修订。", "每次正式提交至少一个附件；同文件内多次活动合成一个条目。有效性与参与证明可有多张、跨页截图。", "系统替代驳回与恢复写StateEvent(actorType=SYSTEM)，不伪装为学生审查员或辅导员的ReviewDecision。", "新高优先级申请正式提交立即替代旧项；失败只恢复该替代造成的旧轮次状态，不覆盖后续独立人工决定。", "多人共享待审队列，一轮仅一次有效审核决定；公示开启、正式提交和奖项替代共用ClassYear并发保护。", "RecognitionTask是recognition_runs与ai_analyses的聚合投影，不是新增表；OCR绑定确切页面，AI基线由修订引用。", "申请大类属于Application；ReviewDecision的revisionId必须等于round.revisionId。StateEvent的actorType和替代两端revisionId为派生属性。", "AwardSupersession存替代前oldLockVersion；恢复以supersededEventId与当前lastEventId等因果一致性作守卫，不虚设替代后版本字段。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "03-activity-scoring-publicity", "name": "活动资格、计分与公示领域类图", "kind": "class", "nodes": 12, "edges": 15, "width": 2979, "height": 1096, "notes": ["规范活动名称与别名用于资格复用；CompetitionProject区分具体届次、赛道／组别、作品，不能用活动大类名称直接去重。", "ActivityQualification的活动资格与个人申请审核分离：个人材料不足不能把整个活动加入无效库。", "人工申报分可编辑且无需理由；ScoreSummary只由当前已通过轮次派生，执行70基准、分类封顶、取最高及两位小数。", "公示开启前没有当前待审正式轮次，草稿不阻挡；开启期间禁止提交、重提和奖项替代，允许保存草稿。", "公示是实时已通过清单，不冻结分数；辅导员仍可驳回已通过项，普通同学只看脱敏截图。", "活动资格变更不自动撤销历史通过项，列出影响供人工复核；公示时长提示三工作日但由辅导员掌握。", "ActivityQualification对应按活动+类别+范围版本化的activity_eligibility_versions；决策包括VALID、INVALID、REMOVED，移除不等于无效。", "ClassPublicity唯一保存当前开关；publicity_events追加开关历史，不另建具有独立状态的PublicityCycle表。", "ScoreRule是绑定ScoreRuleVersion内的类别策略投影；ClassYear.scoreRuleVersionId决定本班学年规则版本。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "04_dfd_context", "name": "数据流图：上下文图", "kind": "dfd", "nodes": 6, "edges": 10, "width": 2051, "height": 412, "notes": ["P0 是唯一系统进程；本图不展示内部数据存储。", "E1 是学生用户；班长和学生审查员是其可叠加职责，特有资料在流名称中注明。", "OCR 和 DeepSeek 是外部服务；请求数据不包含 API 密钥。免费额度耗尽或服务失败可转人工补填。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "05_dfd_level1", "name": "数据流图：一级分解", "kind": "dfd", "nodes": 19, "edges": 73, "width": 6231, "height": 797, "notes": ["本图完整保留上下文图五个外部实体，并将 P0 分解为 P1—P7；五个实体、七个进程、七个逻辑存储共19节点，不为减少节点而隐去边界数据流。", "D1—D7 是逻辑数据分区，不与物理数据库单表一一对应。D3 汇集 applications、application_revisions、submission_rounds；D6 保存审核、替代与恢复履历。", "D2 是由既定评价办法初始化的参考数据；不表示已新增评分规则管理功能。", "D7 按班级＋学年保存公示状态；P3 读取该数据核验正式提交，P7 读取当前待审轮次后办理公示设置。", "成绩按当前可计分轮次实时计算；P4 驳回事实传给 P3 处理替代恢复，不使用触发重算等控制流。", "管理员仅连接 P1；普通学生的同学申请只经 P7 取得脱敏公示，P6 原件查询严格受 D1 的身份和班级范围限制。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "06_dfd_p2_level2", "name": "数据流图：P2 材料识别与人工确认", "kind": "dfd", "nodes": 14, "edges": 23, "width": 2118, "height": 1371, "notes": ["本图只分解 P2；跨边界实体、存储与一级图 P2 的边界完全一致。", "一条申请可有多个原件；同一文件内多次活动合并一个条目。大类来自学生选择。", "OCR／DeepSeek 失败或 OCR 免费额度耗尽时，P2.4 仍能接收手填内容、分值和手动截图；不自动使用收费方案。", "P2.5 只保存工作草稿及修订，不形成正式待审轮次；正式提交由 P3 受理。API 密钥不属于图中的业务数据流。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "07_dfd_p3_level2", "name": "数据流图：P3 正式申报与奖项替代恢复", "kind": "dfd", "nodes": 14, "edges": 27, "width": 2230, "height": 985, "notes": ["P4 是父图中的相邻进程，以 boundary 表示，不能误作系统外部实体；本图跨边界流与一级图 P3 完全一致。", "正式提交首先读取 D7 的同班同学年公示状态；公示期间拒绝正式提交、重提和奖项替代，允许 P2 保存草稿。", "同项目优先比较可得分，同分比较奖项层级；更低或同级重复提交被拦截。明确同项目可自动关联，有歧义时接收学生关联确认。", "高优先级申请正式提交即替代旧轮次，旧项停止计分；新项审核通过才计分，失败或撤回恢复因本次替代影响的旧轮次。", "恢复对象是旧 submission_rounds 的状态和计分资格，不是当前 applications 工作草稿；后续独立人工决定不得被恢复覆盖。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "05a_dfd_level1_external", "name": "一级图审阅切片：外部实体及进程间数据流", "kind": "dfd", "nodes": 12, "edges": 33, "width": 5073, "height": 628, "notes": ["本图是完整05一级图的审阅切片，不能单独视为完整且平衡的一级DFD。", "05a与05b联合、互斥覆盖源文件dfd.json中05_dfd_level1的全部原始数据流；完整原图仍保留。", "所有from、to、label逐字保留；flowId仅为原图数据流的稳定序号L1-F01等，不新增业务逻辑。", "本切片仅展示外部实体与进程、以及进程间的数据流；存储流见05b。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "05b_dfd_level1_storage", "name": "一级图审阅切片：逻辑存储读写数据流", "kind": "dfd", "nodes": 14, "edges": 40, "width": 7451, "height": 496, "notes": ["本图是完整05一级图的审阅切片，不能单独视为完整且平衡的一级DFD。", "05a与05b联合、互斥覆盖源文件dfd.json中05_dfd_level1的全部原始数据流；完整原图仍保留。", "所有from、to、label逐字保留；flowId仅为原图数据流的稳定序号L1-F01等，不新增业务逻辑。", "本切片仅展示进程与逻辑存储之间的读写流；外部及跨进程流见05a。"], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "08-er-overview", "name": "数据库 ER 总览：33 张逻辑表", "kind": "erd", "nodes": 33, "edges": 42, "width": 2659, "height": 1040, "notes": [], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "09-er-rbac", "name": "数据库 ER：账号、组织与 RBAC", "kind": "erd", "nodes": 12, "edges": 13, "width": 1535, "height": 1594, "notes": [], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "10-er-evidence", "name": "数据库 ER：文件、识别与证据", "kind": "erd", "nodes": 11, "edges": 11, "width": 2350, "height": 1053, "notes": [], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "11-er-workflow", "name": "数据库 ER：版本、审核与奖项替代", "kind": "erd", "nodes": 12, "edges": 13, "width": 2443, "height": 1134, "notes": [], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}, {"id": "12-er-catalog", "name": "数据库 ER：活动资格、计分规则与公示", "kind": "erd", "nodes": 9, "edges": 5, "width": 1494, "height": 1663, "notes": [], "warnings": [{"message": "Warning: no hard-coded metrics for 'Microsoft YaHei'.  Falling back to 'Times' metrics", "level": "warning"}]}];let selected=null,ratio=1,base=1;const figure=document.getElementById('figure');const nav=document.getElementById('nav');for(const [i,d]of diagrams.entries()){const b=document.createElement('button');b.innerHTML='<b>'+d.id+'</b><br>'+d.name;b.onclick=()=>select(i);nav.append(b)}function update(){figure.style.width=Math.round(base*ratio)+'px';document.getElementById('scale').textContent=Math.round(ratio*100)+'%'}function fit(){if(!selected)return;ratio=Math.min(1,(document.getElementById('view').clientWidth-30)/base);update()}function zoom(amount){ratio=Math.max(.15,Math.min(3,ratio+amount));update()}function select(i){selected=diagrams[i];for(const [j,b]of [...nav.children].entries())b.classList.toggle('active',i===j);document.getElementById('title').textContent=selected.name;document.getElementById('kind').textContent={class:'UML 类图',dfd:'数据流分析',erd:'数据库 ER'}[selected.kind];document.getElementById('meta').textContent=selected.nodes+' 个节点 · '+selected.edges+' 条关系 / 数据流';const url='图稿/'+selected.id;figure.onload=()=>{base=figure.naturalWidth;fit()};figure.src=url+'.svg';document.getElementById('svgLink').href=url+'.svg';document.getElementById('pngLink').href=url+'.png';const n=document.getElementById('notes');n.textContent='';for(const line of selected.notes||[]){const p=document.createElement('div');p.textContent='• '+line;n.append(p)}document.getElementById('view').scrollTo(0,0);location.hash=selected.id}const initial=Math.max(0,diagrams.findIndex(d=>d.id===decodeURIComponent(location.hash.slice(1))));select(initial);</script></html>

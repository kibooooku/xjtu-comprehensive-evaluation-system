spring:
  application:
    name: xjtu-evaluation-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xjtu_evaluation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:xjtu_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  storage:
    root: ${APP_STORAGE_ROOT:./var/uploads}
    max-pdf-bytes: ${APP_MAX_PDF_BYTES:10485760}

server:
  port: ${BACKEND_PORT:8080}
